<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0708">
<title>Synesthesia remote</title>
<link rel="stylesheet" href="/brand.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.35 var(--font);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:relative;z-index:1;height:100%;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 0 calc(env(safe-area-inset-bottom) + 10px)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand .wordmark{font-size:22px;text-shadow:-1px 0 0 rgba(255,42,58,.8),1px 0 0 rgba(74,91,255,.8),0 0 12px rgba(255,61,127,.5)}
.brand small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px 0 10px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:12px;color:var(--mut);white-space:nowrap;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pill.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)} .pill.warn i{background:#ffc46b} .pill.bad i{background:var(--bad)}

/* the three screens, side by side: swipe, or tap a tab */
nav{position:relative;display:flex;margin:12px 16px 0;padding:3px;border-radius:99px;background:rgba(255,243,234,.06);border:1px solid var(--line)}
nav button{position:relative;z-index:1;flex:1;border:0;background:none;color:var(--mut);padding:8px 0;font:600 13px var(--font);letter-spacing:.02em;cursor:pointer;transition:color .2s}
nav button.on{color:var(--ink)}
nav #bar{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / 3);border-radius:99px;background:linear-gradient(100deg,rgba(255,106,77,.34),rgba(255,61,127,.34) 50%,rgba(122,75,255,.34));box-shadow:0 0 18px rgba(255,61,127,.25);transition:transform .08s linear}
#pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;gap:10px;padding:12px 16px 0;overflow-y:auto;overscroll-behavior:contain}
.hint{margin:0;color:var(--dim);font-size:12.5px;line-height:1.45}

/* sound buttons: its icon in a glowing dome, its name under it */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.snd{position:relative;border:1px solid transparent;border-radius:16px;background:rgba(255,243,234,.045);color:var(--ink);padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:5px;font:600 11px var(--font);line-height:1.15;text-align:center;cursor:pointer;transition:transform .12s,background .2s,border-color .2s}
.snd .badge{width:30px;height:30px}
.snd:active{transform:scale(.94)}
.snd.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,rgba(255,243,234,.04));box-shadow:0 0 16px color-mix(in srgb,var(--c) 30%,transparent)}
.snd.playing .badge{animation:thump .6s ease-in-out infinite alternate}
.snd.playing::after{content:"";position:absolute;inset:-1px;border-radius:inherit;border:1.5px solid var(--c);animation:ring 1.2s ease-out infinite;pointer-events:none}
@keyframes thump{to{transform:scale(1.14);box-shadow:0 0 18px var(--c)}}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.12)}}
.loopmark{position:absolute;top:5px;right:6px;width:10px;height:10px;opacity:.5}

/* Aim: groups, the group's sounds, and the dial */
#groups{display:flex;flex-wrap:wrap;gap:6px}
#picker{min-height:calc(2 * 74px + 6px);align-content:start}   /* two rows kept, so the dial only moves for the biggest groups */
#groups button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;background:none;color:var(--mut);padding:5px 11px 5px 8px;font:600 12px var(--font);cursor:pointer}
#groups button i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
#groups button.on{color:var(--ink);border-color:color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent)}
#dialWrap{flex:1;min-height:170px;display:flex;align-items:center;justify-content:center}
#dial{position:relative;height:100%;max-height:420px;max-width:100%;aspect-ratio:1;touch-action:none;cursor:crosshair}
#dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lbl{font:700 7.5px var(--font);fill:rgba(255,243,234,.55);letter-spacing:.18em;text-anchor:middle;dominant-baseline:middle}
.lbl.back{fill:#ff8a9a}
#fx{pointer-events:none}
.ripple{transform-box:fill-box;transform-origin:center;animation:rip .8s ease-out forwards}
@keyframes rip{from{transform:scale(.2);opacity:.95}to{transform:scale(3.4);opacity:0}}
.beam{animation:beam 1.1s ease-out forwards}
@keyframes beam{0%{opacity:0;stroke-dashoffset:var(--len)}15%{opacity:1}35%{stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
.fade{animation:fade 1.8s ease-out forwards}
@keyframes fade{0%,55%{opacity:1}100%{opacity:0}}
.head{transition:transform .25s}
#readout{text-align:center;min-height:40px}
#readout .main{display:inline-flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700}
#readout .main .badge{width:22px;height:22px}
#readout .sub{font-size:12px;color:var(--dim);margin-top:2px}
.row{display:flex;gap:6px;padding-bottom:4px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:14px;background:rgba(255,243,234,.05);color:var(--ink);padding:11px 6px;font:600 12.5px var(--font);cursor:pointer;white-space:nowrap}
.btn:active{background:rgba(255,243,234,.12)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.on{border-color:rgba(255,61,127,.55);background:linear-gradient(100deg,rgba(255,106,77,.22),rgba(255,61,127,.22) 55%,rgba(122,75,255,.22));color:#fff}

/* Sounds: every sound, grouped */
.group h3{display:flex;align-items:center;gap:8px;margin:10px 0 8px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.group h3 i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.stick{position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(transparent,var(--bg) 45%)}

/* Ambience: sounds that go on, each a switch */
.amb{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:18px;background:rgba(255,243,234,.04);cursor:pointer;transition:background .2s,border-color .2s}
.amb .badge{width:36px;height:36px}
.amb .t{flex:1;min-width:0}
.amb b{display:block;font-size:14.5px}
.amb span{font-size:11.5px;color:var(--dim)}
.amb.on{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.amb.on .badge{animation:thump 1.4s ease-in-out infinite alternate}
.ambs{display:grid;gap:7px}
.sw{flex:none;position:relative;width:44px;height:26px;margin:0;border-radius:99px;background:rgba(255,243,234,.16);cursor:pointer;-webkit-appearance:none;appearance:none;transition:background .25s;pointer-events:none}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .25s}
.sw:checked{background:var(--glow)}
.sw:checked::before{transform:translateX(18px)}
.opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--line);font-size:13px;color:var(--mut);cursor:pointer}
.opt .t{flex:1}
.opt b{display:block;color:var(--ink);font-size:14px}
.opt .sw{pointer-events:auto}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i></div>
<div id="app">
  <header>
    <div class="brand"><span class="wordmark">SYNESTHESIA</span><small>remote</small></div>
    <span id="status" class="pill"><i></i><span>connecting…</span></span>
  </header>
  <nav id="tabs"><i id="bar"></i><button class="on">Aim</button><button>Sounds</button><button>Ambience</button></nav>

  <main id="pages">
    <!-- 1. Aim: pick a sound, tap where it comes from. The display shows it there and this phone plays it. -->
    <section class="page" id="aim">
      <div id="groups"></div>
      <div class="grid" id="picker"></div>
      <div id="dialWrap">
        <div id="dial" aria-label="Tap a direction. Top is ahead, bottom is behind.">
          <svg viewBox="-100 -100 200 200">
            <defs>
              <radialGradient id="dbg" r="1"><stop offset="0" stop-color="#2a1216" stop-opacity=".85"/><stop offset=".7" stop-color="#1a0b0e" stop-opacity=".78"/><stop offset="1" stop-color="#12080a" stop-opacity=".7"/></radialGradient>
              <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a4d"/><stop offset=".5" stop-color="#ff3d7f"/><stop offset="1" stop-color="#7a4bff"/></linearGradient>
            </defs>
            <circle r="96" fill="url(#dbg)" stroke="url(#rim)" stroke-opacity=".55" stroke-width="1"/>
            <path d="M0 0 L67.9 67.9 A96 96 0 0 1 -67.9 67.9 Z" fill="#ff2a3a" fill-opacity=".08"/>
            <circle r="64" fill="none" stroke="rgba(255,243,234,.1)" stroke-width=".6"/>
            <circle r="32" fill="none" stroke="rgba(255,243,234,.1)" stroke-width=".6"/>
            <g stroke="rgba(255,243,234,.1)" stroke-width=".6" id="spokes"></g>
            <text class="lbl" y="-85">AHEAD</text>
            <text class="lbl back" y="86">BEHIND</text>
            <text class="lbl" x="-84" y="0" transform="rotate(-90 -84 0)">LEFT</text>
            <text class="lbl" x="84" y="0" transform="rotate(90 84 0)">RIGHT</text>
            <g id="fx"></g>
            <g class="head">
              <circle r="12.5" fill="#2a1418" stroke="rgba(255,243,234,.45)" stroke-width="1"/>
              <path d="M-4 -11.8 L0 -18.5 L4 -11.8 Z" fill="rgba(255,243,234,.6)"/>
              <ellipse cx="-13" cy="0" rx="2.3" ry="4" fill="rgba(255,243,234,.45)"/>
              <ellipse cx="13" cy="0" rx="2.3" ry="4" fill="rgba(255,243,234,.45)"/>
            </g>
          </svg>
        </div>
      </div>
      <div id="readout"><div class="main">Pick a sound, tap a direction</div><div class="sub">Top of the dial is where the wearer faces · swipe for more</div></div>
      <div class="row">
        <button class="btn" id="spk" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>Phone</button>
        <button class="btn" id="snap"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/></svg>Snap 45°</button>
        <button class="btn" id="again"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4.5h4.5"/></svg>Again</button>
        <button class="btn" id="clear"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Clear</button>
      </div>
    </section>

    <!-- 2. Sounds: every sound, played on this phone only -->
    <section class="page" id="board">
      <p class="hint">Every sound it knows. Tap to play it on this phone (tap again to stop). Nothing is sent to the display.</p>
      <div id="boardList"></div>
      <div class="stick"><button class="btn" id="stopAll" style="width:100%"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Stop everything</button></div>
    </section>

    <!-- 3. Ambience: sounds that go on, as switches -->
    <section class="page" id="amb">
      <label class="opt" for="ambShow"><span class="t"><b>Show on the display</b>All around the edge, for as long as it plays</span><input type="checkbox" class="sw" id="ambShow" role="switch"></label>
      <div class="ambs" id="ambList"></div>
      <div class="stick"><button class="btn" id="ambOff" style="width:100%"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>All off</button></div>
    </section>
  </main>
</div>

<script type="module">
import { SOUNDS, GROUPS, connect, dirWord, wrap } from '/common.js';
import { iconSvg } from '/icons.js';
import { createSfx } from '/sfx.js';

const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const load = (k, d) => { try { const v = localStorage.getItem('syn.remote.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem('syn.remote.' + k, JSON.stringify(v)); } catch {} };
const badge = (s, cls = '') => `<span class="badge ${cls}" style="--c:${s.color};--k:${s.core}">${iconSvg(s.icon)}</span>`;
const LOOP = '<svg class="loopmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>';

let current = load('sound', 'fire'), group = SOUNDS[current]?.group || 'danger';
let snap = false, last = null, displays = 0, phone = load('phone', true);
const pending = new Map();   // cid -> send time, to show the round trip

// The phone's speaker. Browsers only allow sound after a tap, so it's made on the first one.
let sfx = null;
const audio = () => { if (!sfx) sfx = createSfx(); sfx.unlock(); return sfx; };
addEventListener('pointerdown', () => audio(), { capture: true, once: true });
window.__remote = { get sfx() { return sfx; } };   // handy in the console: __remote.sfx.playing()

// ================= screens =================
const tabs = [...$('tabs').querySelectorAll('button')];
tabs.forEach((b, i) => b.onclick = () => $('pages').scrollTo({ left: i * $('pages').clientWidth, behavior: 'smooth' }));
$('pages').addEventListener('scroll', () => {
  const p = $('pages'), x = p.scrollLeft / p.clientWidth;
  $('bar').style.transform = `translateX(${x * 100}%)`;
  tabs.forEach((b, i) => b.classList.toggle('on', Math.round(x) === i));
}, { passive: true });

// ================= connection =================
const hub = connect('remote', {
  onState: (s) => setStatus(s === 'open' ? (displays ? 'ok' : 'warn') : s === 'connecting' ? '' : 'bad',
                            s === 'open' ? displayText() : s === 'connecting' ? 'connecting…' : 'reconnecting…'),
  onMessage: (m) => {
    if (m.type === 'status') { displays = m.displays; setStatus(displays ? 'ok' : 'warn', displayText()); }
    if (m.type === 'alert' && m.cid && pending.has(m.cid)) {
      const ms = Math.round(performance.now() - pending.get(m.cid)); pending.delete(m.cid);
      const sub = $('readout').querySelector('.sub');
      if (sub) sub.textContent = displays ? `On ${displays} display${displays > 1 ? 's' : ''} · ${ms} ms${phone ? ' · playing here' : ''}`
                                          : 'The hub got it, but no display is connected. Open /display on the AR phone.';
    }
  },
});
const displayText = () => displays ? `${displays} display${displays > 1 ? 's' : ''}` : 'no display';
function setStatus(cls, text) { $('status').className = 'pill ' + cls; $('status').lastElementChild.textContent = text; }

// ================= 1. Aim =================
for (const g of GROUPS) {
  const b = document.createElement('button');
  b.style.setProperty('--c', g.color); b.innerHTML = `<i></i>${g.label}`; b.dataset.g = g.key;
  b.onclick = () => { group = g.key; drawGroups(); };
  $('groups').append(b);
}
function drawGroups() {
  for (const b of $('groups').children) b.classList.toggle('on', b.dataset.g === group);
  $('picker').innerHTML = '';
  for (const [key, s] of Object.entries(SOUNDS)) {
    if (s.group !== group) continue;
    const b = document.createElement('button');
    b.className = 'snd' + (key === current ? ' on' : ''); b.style.setProperty('--c', s.color);
    b.innerHTML = badge(s) + s.label + (s.loop ? LOOP : '');
    b.onclick = () => { current = key; save('sound', key); for (const x of $('picker').children) x.classList.toggle('on', x === b); buzz(8); };
    $('picker').append(b);
  }
}
drawGroups();
for (let i = 0; i < 8; i++) {
  const a = i * Math.PI / 4, l = document.createElementNS(NS, 'line');
  l.setAttribute('x1', 18 * Math.sin(a)); l.setAttribute('y1', -18 * Math.cos(a));
  l.setAttribute('x2', 96 * Math.sin(a)); l.setAttribute('y2', -96 * Math.cos(a));
  $('spokes').append(l);
}

$('dial').addEventListener('pointerdown', (e) => {
  const r = $('dial').getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 200 - 100, y = (e.clientY - r.top) / r.height * 200 - 100;
  if (Math.hypot(x, y) > 100) return;
  let angle = Math.atan2(x, -y) * 180 / Math.PI;   // 0 = up (ahead), clockwise positive
  if (snap) angle = Math.round(angle / 45) * 45;
  fire(current, wrap(angle));
});

let aimVoice = null;
function fire(sound, angle) {
  const s = SOUNDS[sound], cid = Math.random().toString(36).slice(2, 9);
  last = { sound, angle };
  pending.set(cid, performance.now());
  const len = audio().length(sound);
  const sent = hub.send({ type: 'alert', sound, angle, cid, ttl: Math.max(6000, Math.round(len * 1000) + 1500) });
  if (phone) { aimVoice?.stop(0.15); aimVoice = audio().play(sound, { angle }); }
  animate(angle, s);
  buzz(15);
  $('readout').innerHTML = `<div class="main" style="color:${s.color}">${badge(s)}${s.label} · ${dirWord(angle)} (${Math.round(angle)}°)</div>
    <div class="sub">${sent ? 'sending…' : 'Not connected to the laptop' + (phone ? ', playing here only' : '') + '. Is server.py running?'}</div>`;
}

function animate(angle, s) {
  const a = angle * Math.PI / 180, R = 76, x = R * Math.sin(a), y = -R * Math.cos(a), fx = $('fx'), color = s.color;
  const add = (tag, attrs, cls) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); if (cls) el.setAttribute('class', cls); fx.append(el); setTimeout(() => el.remove(), 1900); return el; };
  const beam = add('line', { x1: 0, y1: 0, x2: x, y2: y, stroke: color, 'stroke-width': 2.4, 'stroke-linecap': 'round', 'stroke-dasharray': R, style: `--len:${R}` }, 'beam');
  beam.style.filter = `drop-shadow(0 0 4px ${color})`;
  add('circle', { cx: x, cy: y, r: 10, fill: 'none', stroke: color, 'stroke-width': 2 }, 'ripple');
  setTimeout(() => add('circle', { cx: x, cy: y, r: 10, fill: 'none', stroke: s.core, 'stroke-width': 1.2 }, 'ripple'), 150);
  // the sound's badge lands where you tapped, like the beacon on the display
  const g = add('g', { transform: `translate(${x} ${y})` }, 'fade'), id = 'bb' + Math.random().toString(36).slice(2);
  g.innerHTML = `<defs><radialGradient id="${id}" cx=".5" cy="1.1" r="1"><stop offset="0" stop-color="${s.core}"/><stop offset=".65" stop-color="${color}"/></radialGradient></defs>`
    + `<circle r="9" fill="url(#${id})" style="filter:drop-shadow(0 0 5px ${color})"/>`
    + `<g transform="translate(-6.5 -6.5) scale(.5417)" color="rgba(14,4,8,.86)">${iconSvg(s.icon).replace(/<\/?svg[^>]*>/g, '')}</g>`;
  const head = document.querySelector('.head');
  head.style.transform = `rotate(${Math.max(-25, Math.min(25, angle / 4))}deg)`;
  setTimeout(() => head.style.transform = '', 500);
}

const buzz = (ms) => navigator.vibrate?.(ms);   // Android only; iPhone browsers ignore it
const setPhone = (on) => { phone = on; save('phone', on); $('spk').classList.toggle('on', on); $('spk').setAttribute('aria-pressed', on); if (!on) aimVoice?.stop(); };
setPhone(phone);
$('spk').onclick = () => setPhone(!phone);
$('snap').onclick = () => { snap = !snap; $('snap').classList.toggle('on', snap); };
$('again').onclick = () => last && fire(last.sound, last.angle);
$('clear').onclick = () => {
  hub.send({ type: 'clear' }); aimVoice?.stop(); buzz(10);
  $('readout').innerHTML = '<div class="main">Cleared</div><div class="sub">Every sound cleared from the display</div>';
};

// ================= 2. Sounds (this phone only) =================
const boardPlaying = new Map();   // key -> { voice, timer }
for (const g of GROUPS) {
  const sec = document.createElement('div'); sec.className = 'group'; sec.style.setProperty('--c', g.color);
  sec.innerHTML = `<h3><i></i>${g.label}</h3><div class="grid"></div>`;
  for (const [key, s] of Object.entries(SOUNDS)) {
    if (s.group !== g.key) continue;
    const b = document.createElement('button');
    b.className = 'snd'; b.style.setProperty('--c', s.color); b.dataset.k = key;
    b.innerHTML = badge(s) + s.label + (s.loop ? LOOP : '');
    b.onclick = () => boardPlaying.has(key) ? boardStop(key) : boardPlay(key, b);
    sec.lastElementChild.append(b);
  }
  $('boardList').append(sec);
}
function boardPlay(key, b) {
  const v = audio().play(key);
  b.classList.add('playing');
  const timer = setTimeout(() => boardStop(key, false), (audio().length(key) + 0.4) * 1000);
  boardPlaying.set(key, { v, timer, b });
  buzz(8);
}
function boardStop(key, cut = true) {
  const p = boardPlaying.get(key); if (!p) return;
  if (cut) p.v.stop(); clearTimeout(p.timer); p.b.classList.remove('playing'); boardPlaying.delete(key);
}
$('stopAll').onclick = () => { for (const k of [...boardPlaying.keys()]) boardStop(k); sfx?.stopAll(); for (const k of [...ambOn.keys()]) ambSet(k, false); aimVoice = null; };

// ================= 3. Ambience: toggles =================
const ambOn = new Map();          // key -> loop voice
let ambShow = load('ambShow', true);
$('ambShow').checked = ambShow;
$('ambShow').onchange = (e) => {
  ambShow = e.target.checked; save('ambShow', ambShow);
  for (const k of ambOn.keys()) ambShow ? showAmb(k, true) : hub.send({ type: 'clear', sound: k });
};
const DESC = { rain: 'steady rain, drops close by', stream: 'a babbling brook', ocean: 'waves on a shore', wind: 'gusts rising and falling', bird: 'two birds singing',
  crickets: 'a summer night', crackle: 'a fire', ambient: 'a busy room, people talking', music: 'a little groove', kids: 'children playing', typing: 'someone at a keyboard',
  clock: 'tick… tock…', washer: 'the drum turning', vacuum: 'a vacuum cleaner', snore: 'someone asleep', thunder: 'a storm, thunder now and then' };
for (const [key, s] of Object.entries(SOUNDS)) {
  if (!s.loop) continue;
  const row = document.createElement('div');
  row.className = 'amb'; row.style.setProperty('--c', s.color); row.dataset.k = key;
  row.innerHTML = `${badge(s)}<div class="t"><b>${s.label}</b><span>${DESC[key] || ''}</span></div><input type="checkbox" class="sw" tabindex="-1" aria-label="${s.label}">`;
  row.onclick = () => ambSet(key, !ambOn.has(key));
  $('ambList').append(row);
}
function ambSet(key, on) {
  const row = $('ambList').querySelector(`[data-k="${key}"]`);
  if (on && !ambOn.has(key)) { ambOn.set(key, audio().loop(key)); if (ambShow) showAmb(key, true); buzz(8); }
  if (!on && ambOn.has(key)) { ambOn.get(key).stop(0.6); ambOn.delete(key); if (ambShow) hub.send({ type: 'clear', sound: key }); }
  row.classList.toggle('on', on); row.querySelector('.sw').checked = on;
}
// An ambience on the display: heard all around (no direction), refreshed while it plays, cleared when it stops.
function showAmb(key, first) { hub.send({ type: 'alert', sound: key, angle: null, ttl: 12000, hold: !first }); }
setInterval(() => { if (ambShow) for (const k of ambOn.keys()) showAmb(k, false); }, 8000);
$('ambOff').onclick = () => { for (const k of [...ambOn.keys()]) ambSet(k, false); };
addEventListener('pagehide', () => { for (const k of ambOn.keys()) hub.send({ type: 'clear', sound: k }); });
</script>
