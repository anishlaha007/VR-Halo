<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e13">
<title>Sound Remote</title>
<style>
:root{--bg:#0b0e13;--card:#151a22;--line:#262e3a;--fg:#e8ecf1;--mut:#8b95a3;--ok:#3ecf8e;--warn:#f5a524;--bad:#ff4d4f;--sel:#5b9dff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 14px);max-width:520px;margin:0 auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:19px;margin:0;font-weight:750;letter-spacing:.2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--card);font-size:12.5px;color:var(--mut);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.pill.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)} .pill.warn i{background:var(--warn)} .pill.bad i{background:var(--bad)}

#sounds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{border:0;border-radius:14px;background:var(--card);color:var(--fg);padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 13px system-ui,sans-serif;outline:2px solid transparent;transition:transform .12s,outline-color .15s,background .15s}
.chip b{font-size:24px;line-height:1}
.chip:active{transform:scale(.95)}
.chip.on{outline-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card))}

#dialWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#dial{position:relative;width:min(100%,62vh,440px);aspect-ratio:1;touch-action:none;cursor:crosshair}
#dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lbl{font:700 12px system-ui,sans-serif;fill:var(--mut);letter-spacing:1.4px;text-anchor:middle;dominant-baseline:middle}
.lbl.back{fill:#ff8d8e}
#fx{pointer-events:none}
.ripple{transform-box:fill-box;transform-origin:center;animation:rip .7s ease-out forwards}
@keyframes rip{from{transform:scale(.2);opacity:.95}to{transform:scale(3.2);opacity:0}}
.beam{animation:beam 1.1s ease-out forwards}
@keyframes beam{0%{opacity:0;stroke-dashoffset:var(--len)}15%{opacity:1}35%{stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
.dot{animation:dot 1.6s ease-out forwards}
@keyframes dot{0%,60%{opacity:1}100%{opacity:0}}
.head{transition:transform .25s}

#readout{text-align:center;min-height:42px}
#readout .main{font-size:17px;font-weight:700}
#readout .sub{font-size:12.5px;color:var(--mut)}
.row{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:12px;background:var(--card);color:var(--fg);padding:12px 8px;font:600 14px system-ui,sans-serif}
.btn:active{background:var(--line)}
.btn.on{background:color-mix(in srgb,var(--sel) 25%,var(--card));color:#cfe0ff}
</style>
</head>
<body>
<header>
  <h1>Sound remote</h1>
  <span id="status" class="pill"><i></i><span>connecting…</span></span>
</header>

<div id="sounds"></div>

<div id="dialWrap">
  <div id="dial" aria-label="Tap a direction. Top is ahead, bottom is behind.">
    <svg viewBox="-100 -100 200 200">
      <defs>
        <radialGradient id="bg" r="1"><stop offset="0" stop-color="#1a212c"/><stop offset="1" stop-color="#11161d"/></radialGradient>
      </defs>
      <circle r="96" fill="url(#bg)" stroke="#262e3a" stroke-width="1.2"/>
      <!-- behind zone: the 90° the product alerts on -->
      <path d="M0 0 L67.9 67.9 A96 96 0 0 1 -67.9 67.9 Z" fill="#ff4d4f" fill-opacity=".09"/>
      <circle r="64" fill="none" stroke="#262e3a" stroke-width=".8"/>
      <circle r="32" fill="none" stroke="#262e3a" stroke-width=".8"/>
      <g stroke="#262e3a" stroke-width=".8" id="spokes"></g>
      <text class="lbl" y="-84">AHEAD</text>
      <text class="lbl back" y="85">BEHIND</text>
      <text class="lbl" x="-82" y="0" transform="rotate(-90 -82 0)">LEFT</text>
      <text class="lbl" x="82" y="0" transform="rotate(90 82 0)">RIGHT</text>
      <g id="fx"></g>
      <!-- the listener, seen from above, facing up -->
      <g class="head">
        <circle r="13" fill="#2a3342" stroke="#5c6a7e" stroke-width="1.2"/>
        <path d="M-4 -12.2 L0 -19 L4 -12.2 Z" fill="#5c6a7e"/>
        <ellipse cx="-13.5" cy="0" rx="2.4" ry="4.2" fill="#5c6a7e"/>
        <ellipse cx="13.5" cy="0" rx="2.4" ry="4.2" fill="#5c6a7e"/>
      </g>
    </svg>
  </div>
</div>

<div id="readout"><div class="main">Pick a sound, tap a direction</div><div class="sub">Top of the dial is where the wearer is facing</div></div>

<div class="row">
  <button class="btn" id="snap">Snap 45°</button>
  <button class="btn" id="again">Repeat last</button>
  <button class="btn" id="clear">Clear all</button>
</div>

<script type="module">
import { SOUNDS, connect, dirWord, wrap } from '/common.js';

const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
let current = 'fire', snap = false, last = null, displays = 0;
const pending = new Map();   // cid -> send time, to measure delivery time

// ---- sound chips ----
for (const [key, s] of Object.entries(SOUNDS)) {
  if (key === 'behind') continue;
  const b = document.createElement('button');
  b.className = 'chip' + (key === current ? ' on' : '');
  b.style.setProperty('--c', s.color);
  b.innerHTML = `<b>${s.icon}</b>${s.label}`;
  b.onclick = () => { current = key; document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); buzz(8); };
  $('sounds').append(b);
}
// 8 spokes
for (let i = 0; i < 8; i++) {
  const a = i * Math.PI / 4, l = document.createElementNS(NS, 'line');
  l.setAttribute('x1', 18 * Math.sin(a)); l.setAttribute('y1', -18 * Math.cos(a));
  l.setAttribute('x2', 96 * Math.sin(a)); l.setAttribute('y2', -96 * Math.cos(a));
  $('spokes').append(l);
}

// ---- connection ----
const hub = connect('remote', {
  onState: (s) => setStatus(s === 'open' ? (displays ? 'ok' : 'warn') : s === 'connecting' ? '' : 'bad',
                            s === 'open' ? displayText() : s === 'connecting' ? 'connecting…' : 'reconnecting…'),
  // (if WebSockets are blocked, common.js quietly switches to the https fallback; the pill works the same)
  onMessage: (m) => {
    if (m.type === 'status') { displays = m.displays; setStatus(displays ? 'ok' : 'warn', displayText()); }
    if (m.type === 'alert' && m.cid && pending.has(m.cid)) {
      const ms = Math.round(performance.now() - pending.get(m.cid)); pending.delete(m.cid);
      $('readout').querySelector('.sub').textContent =
        displays ? `Delivered to ${displays} display${displays > 1 ? 's' : ''} · ${ms} ms round trip` : 'Hub got it, but no display is connected. Open /display on the AR phone.';
    }
  },
});
const displayText = () => displays ? `${displays} display${displays > 1 ? 's' : ''}` : 'no display';
function setStatus(cls, text) { $('status').className = 'pill ' + cls; $('status').lastElementChild.textContent = text; }

// ---- tapping the dial ----
$('dial').addEventListener('pointerdown', (e) => {
  const r = $('dial').getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 200 - 100, y = (e.clientY - r.top) / r.height * 200 - 100;
  if (Math.hypot(x, y) > 100) return;
  let angle = Math.atan2(x, -y) * 180 / Math.PI;   // 0 = up (ahead), clockwise positive
  if (snap) angle = Math.round(angle / 45) * 45;
  fire(current, wrap(angle));
});

function fire(sound, angle) {
  const s = SOUNDS[sound], cid = Math.random().toString(36).slice(2, 9);
  last = { sound, angle };
  pending.set(cid, performance.now());
  const sent = hub.send({ type: 'alert', sound, angle, cid });
  animate(angle, s.color);
  buzz(15);
  $('readout').innerHTML = `<div class="main" style="color:${s.color}">${s.icon} ${s.label} · ${dirWord(angle)} (${Math.round(angle)}°)</div>
    <div class="sub">${sent ? 'sending…' : 'Not connected to the laptop. Is server.py running?'}</div>`;
}

function animate(angle, color) {
  const a = angle * Math.PI / 180, R = 78, x = R * Math.sin(a), y = -R * Math.cos(a), fx = $('fx');
  const add = (tag, attrs, cls) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); if (cls) el.setAttribute('class', cls); fx.append(el); setTimeout(() => el.remove(), 1700); return el; };
  const beam = add('line', { x1: 0, y1: 0, x2: x, y2: y, stroke: color, 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-dasharray': R, style: `--len:${R}` }, 'beam');
  beam.style.filter = `drop-shadow(0 0 4px ${color})`;
  add('circle', { cx: x, cy: y, r: 9, fill: 'none', stroke: color, 'stroke-width': 2.5 }, 'ripple');
  setTimeout(() => add('circle', { cx: x, cy: y, r: 9, fill: 'none', stroke: color, 'stroke-width': 1.5 }, 'ripple'), 140);
  add('circle', { cx: x, cy: y, r: 6, fill: color }, 'dot');
  // the head glances toward the sound
  const head = document.querySelector('.head');
  head.style.transform = `rotate(${Math.max(-25, Math.min(25, angle / 4))}deg)`;
  setTimeout(() => head.style.transform = '', 500);
}

const buzz = (ms) => navigator.vibrate?.(ms);   // Android only; iPhone browsers ignore it

$('snap').onclick = () => { snap = !snap; $('snap').classList.toggle('on', snap); };
$('again').onclick = () => last && fire(last.sound, last.angle);
$('clear').onclick = () => { hub.send({ type: 'clear' }); buzz(10); $('readout').innerHTML = '<div class="main">Cleared</div><div class="sub">All sounds cleared from the display</div>'; };
</script>
</body>
</html>
